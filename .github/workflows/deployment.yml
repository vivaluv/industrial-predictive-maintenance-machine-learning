name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vivaluv-predictive-maintenance.streamlit.app

    steps:
      - name: Verify live Streamlit app
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --max-time 120 https://vivaluv-predictive-maintenance.streamlit.app
